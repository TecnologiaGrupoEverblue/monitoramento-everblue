# Destino na variável $emon_api (definida no server): força a resolução do nome
# a cada requisição. Sem caminho no proxy_pass, a URI segue íntegra.
proxy_pass http://$emon_api;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# É por aqui que a API sabe que a conversa chegou por HTTPS.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
# proxy_read_timeout fica a cargo de cada location (declarar aqui e lá daria
# "directive is duplicate" e o nginx não iniciaria).
