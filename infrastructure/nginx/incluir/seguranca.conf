# Cabeçalhos de segurança da interface e da API — definidos NUM lugar só.
#
# Atenção ao nginx: `add_header` numa location SUBSTITUI os do nível acima.
# Por isso toda location que declara o próprio `add_header` inclui este
# arquivo de novo.
#
# CSP: nenhum script de terceiros, nenhuma CDN. `style-src 'unsafe-inline'` é
# necessário porque React e Recharts aplicam estilo por atributo; scripts
# continuam restritos à origem.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS: um ano, sem subdomínios e SEM preload (zona interna — preload
# registraria o domínio numa lista pública).
add_header Strict-Transport-Security "max-age=31536000" always;
