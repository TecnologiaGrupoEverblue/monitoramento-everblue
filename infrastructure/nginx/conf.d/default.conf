# Publicação do Monitoramento Everblue na rede interna.
#
#   monitoramento.grupoeverblue.com.br   interface (React estático) + API
#
# O nome resolve APENAS na zona interna do DNS. Não há publicação na internet:
# quem não está na rede da companhia (ou na VPN) não chega aqui — mesma regra
# da IA Everblue. TLS é obrigatório: o Entra ID recusa endereço de retorno que
# não seja https.

# Resolução do nome `api` a cada requisição (resolvedor interno do Docker).
# Um `upstream` fixo guardaria o IP antigo depois de um rebuild e devolveria
# 502 até alguém reiniciar o nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone  $binary_remote_addr zone=emon_login:10m  rate=10r/m;
limit_req_zone  $binary_remote_addr zone=emon_oidc:10m   rate=120r/m;
limit_req_zone  $binary_remote_addr zone=emon_envio:10m  rate=30r/m;
limit_req_zone  $binary_remote_addr zone=emon_api:10m    rate=1200r/m;
limit_conn_zone $binary_remote_addr zone=emon_conexoes:10m;

# `$emon_nome_publicado` = 1 quando o pedido chegou pelo nome oficial. Antes de
# o DNS interno publicar o registro, o acesso por IP na porta 80 não é mandado
# para um nome que ainda não resolve.
map $host $emon_nome_publicado {
    default                              0;
    monitoramento.grupoeverblue.com.br   1;
}

# ============================================================================
# Porta 80 — só leva ao HTTPS (e responde a verificação de saúde)
# ============================================================================
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    set $emon_api "api:3000";

    # Monitoramento externo: nunca redirecionado (301 em teste de vida é lido
    # como "fora do ar" por boa parte das ferramentas).
    location = /api/health/live {
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_read_timeout 10s;
        access_log off;
    }

    location / {
        if ($emon_nome_publicado) { return 301 https://$host$request_uri; }
        return 301 https://monitoramento.grupoeverblue.com.br$request_uri;
    }
}

# ============================================================================
# 443 — interface e API
# ============================================================================
server {
    listen 443 ssl default_server;
    http2 on;
    server_name monitoramento.grupoeverblue.com.br;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/emon.crt;
    ssl_certificate_key /etc/nginx/certs/emon.key;
    include /etc/nginx/incluir/tls.conf;

    set $emon_api "api:3000";
    root /usr/share/nginx/html;

    client_max_body_size 25m;          # IMPORTACAO_MAX_MB (20) + folga do multipart
    client_body_timeout 120s;
    send_timeout 3600s;               # download de arquivo grande
    limit_conn emon_conexoes 40;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    include /etc/nginx/incluir/seguranca.conf;

    # --------------------------------------------------------------- login
    # Início do login corporativo e retorno do Entra ID. Limite folgado: quem
    # chega ao retorno já foi autenticado pelo tenant, e barrar por engano
    # derrubaria o login da companhia num pico de entrada.
    location = /entrar/entra {
        limit_req zone=emon_oidc burst=30 nodelay;
        limit_req_status 429;
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_read_timeout 30s;
    }
    location /oauth/ {
        limit_req zone=emon_oidc burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_read_timeout 60s;
    }
    # Conta de emergência: senha → limite rígido (a API tem bloqueio próprio).
    location = /api/v1/autenticacao/emergencia {
        limit_req zone=emon_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------- envio de planilha
    location = /api/v1/importacoes {
        limit_req zone=emon_envio burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    # ------------------------------------------------- Central de Arquivos
    # Todo o ciclo de vida dos arquivos (envio, versões, download). Sem limite
    # de tamanho no proxy (o limite, se houver, é ARQUIVOS_MAX_MB na API) e sem
    # buffer: o arquivo passa em fluxo do navegador ao MinIO e de volta.
    location /api/v1/arquivos {
        client_max_body_size 0;
        client_body_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        limit_req zone=emon_api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_read_timeout 3600s;
    }

    # ----------------------------------------------------------------- API
    location /api/ {
        limit_req zone=emon_api burst=200 nodelay;
        limit_req_status 429;
        include /etc/nginx/incluir/proxy_comum.conf;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------ estáticos
    # Arquivos com hash no nome: cache longo e imutável.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/incluir/seguranca.conf;
        try_files $uri =404;
    }
    location ~ ^/(fontes|marca)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/incluir/seguranca.conf;
        try_files $uri =404;
    }
    location /modelos/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/incluir/seguranca.conf;
        try_files $uri =404;
    }

    # SPA: toda rota da interface cai no index.html, que NUNCA é cacheado —
    # senão uma versão nova só aparece depois de o navegador esquecer a antiga.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/incluir/seguranca.conf;
        try_files $uri /index.html;
    }
}
